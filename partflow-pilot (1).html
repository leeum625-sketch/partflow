<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTFLOW · 파일럿 체크인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#e8c4c4; --rose-deep:#c98f8f;
    --sage:#a8b89a; --sage-deep:#7d9270;
    --amber:#e0b16a;
    --cream:#faf6f1; --card:#ffffff;
    --ink:#3a332f; --ink-soft:#948b84; --line:#ece4dc;
    --shadow:0 8px 24px rgba(180,150,130,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Pretendard',-apple-system,sans-serif;
    background:linear-gradient(180deg,#f3ede6 0%,#e8dfd5 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:40px 20px; color:var(--ink);
  }
  .phone{
    width:380px; height:780px; background:var(--cream);
    border-radius:44px; box-shadow:0 30px 60px rgba(90,70,50,0.22),0 0 0 10px #2a2622;
    overflow:hidden; position:relative; display:flex; flex-direction:column;
  }
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#2a2622; border-radius:0 0 16px 16px; z-index:10;}
  .screen{ flex:1; overflow-y:auto; padding:44px 22px 40px; }
  .screen::-webkit-scrollbar{display:none;}

  .greet-label{font-size:12px; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase;}
  .greet-title{font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin-top:4px; line-height:1.3;}
  .greet-title em{font-style:italic; color:var(--rose-deep); font-weight:400;}
  .lede{ font-size:13px; color:var(--ink-soft); margin-top:10px; line-height:1.6; }

  .card{
    background:var(--card); border-radius:22px; padding:20px; margin-top:18px;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .card-title{font-family:'Fraunces',serif; font-size:16px; font-weight:500;}
  .card-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}

  label{ display:block; font-size:12px; color:var(--ink-soft); margin-top:16px; margin-bottom:6px; }
  input[type=text], input[type=tel]{
    width:100%; padding:12px 13px; border-radius:14px; border:1px solid var(--line);
    background:#fbf8f5; font-family:inherit; font-size:14px; color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--rose-deep); }

  .mood-row{display:flex; gap:9px; margin-top:16px;}
  .mood{
    flex:1; aspect-ratio:1; border-radius:14px; background:#f6f0ea; display:flex;
    align-items:center; justify-content:center; font-size:20px; cursor:pointer;
    border:1.5px solid transparent; transition:.15s;
  }
  .mood.active{ background:#fff; border-color:var(--rose-deep); box-shadow:0 6px 14px rgba(201,143,143,.25); }

  textarea{
    width:100%; margin-top:14px; border:1px solid var(--line); border-radius:14px;
    padding:12px; font-family:inherit; font-size:13px; resize:none; height:64px; background:#fbf8f5; color:var(--ink);
  }
  textarea:focus{ outline:none; border-color:var(--rose-deep); }

  .btn{
    margin-top:16px; width:100%; padding:13px; border:none; border-radius:14px;
    background:var(--rose-deep); color:#fff; font-family:'Pretendard'; font-weight:600;
    font-size:13.5px; cursor:pointer; transition:.15s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ background:#d9cfc7; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--ink-soft); font-size:12px; margin-top:10px; padding:8px;
    text-align:center; cursor:pointer;
  }

  .error{ font-size:12px; color:var(--rose-deep); margin-top:8px; min-height:14px; }

  .section-head{display:flex; justify-content:space-between; align-items:center; margin-top:26px; margin-bottom:12px;}
  .section-title{font-family:'Fraunces',serif; font-size:15px; font-weight:500;}
  .section-count{ font-size:11.5px; color:var(--ink-soft); }

  .staff-card{
    display:flex; align-items:center; gap:13px; background:var(--card);
    border-radius:18px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .avatar{
    width:42px; height:42px; border-radius:13px; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:14px; color:#fff; font-weight:500;
  }
  .staff-info{ flex:1; min-width:0; }
  .staff-name{ font-size:14px; font-weight:600; }
  .staff-note{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .mood-badge{ font-size:20px; }
  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:12.5px; line-height:1.6; }

  .toast{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:12.5px;
    opacity:0; transition:.3s; pointer-events:none; white-space:nowrap; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .top-tag{
    position:absolute; top:36px; left:22px; z-index:20; font-size:11px; color:var(--ink-soft);
    background:rgba(255,255,255,0.85); padding:6px 12px; border-radius:16px; border:1px solid var(--line);
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div id="topTag"></div>
  <div class="screen" id="screen"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ===== 파일럿 참여자 명단 (실제 배포 시 관리자 화면에서 등록) ===== */
const ROSTER = [
  {id:'minji',  name:'김민지', phone4:'1234', color:'linear-gradient(135deg,#c98f8f,#e8c4c4)', initial:'민'},
  {id:'seojun', name:'이서준', phone4:'5678', color:'linear-gradient(135deg,#e0b16a,#f0d09a)', initial:'서'},
  {id:'haeun',  name:'박하은', phone4:'4321', color:'linear-gradient(135deg,#7d9270,#a8b89a)', initial:'하'}
];
const OWNER = {name:'박대표', code:'0000'}; /* 파일럿용 오너 계정 — 실제 이름/코드로 교체 */
const MOODS = ['😔','😐','🙂','😄','🌟'];

/* ===== 다국어 사전 (직원 화면 전용 — 오너 화면은 항상 한국어) ===== */
const LANGS = [
  {code:'ko', label:'한국어'},
  {code:'en', label:'English'},
  {code:'vi', label:'Tiếng Việt'},
  {code:'zh', label:'中文'}
];
const I18N = {
  ko:{
    loginTitle1:'이름과 전화번호', loginTitle2:'뒷자리 4자리로 시작해요',
    lede:'별도 앱 설치 없이, 이 화면만으로 체크인할 수 있어요.',
    nameLabel:'이름', namePh:'예: 김민지',
    phoneLabel:'전화번호 뒷자리 4자리', phonePh:'1234',
    startBtn:'체크인 시작하기', ownerLink:'사장님이신가요? 오너 로그인',
    loginErr:'일치하는 정보가 없어요. 이름과 뒷자리를 확인해주세요.',
    checkinLabel:'오늘의 체크인', hello:'안녕하세요,', helloSuffix:'님',
    cardTitle:'오늘 컨디션은 어떠세요?', cardSub:'사장님에게 가볍게 전달돼요. 부담 갖지 않으셔도 돼요.',
    notePh:'한 줄로 남기고 싶은 말이 있다면 (선택)', submitBtn:'체크인 남기기',
    toastOk:'체크인 완료 — 감사해요 🌿', toastFail:'저장에 실패했어요, 다시 시도해주세요',
    loggedInSuffix:'로 로그인됨', logout:'로그아웃', langLabel:'언어'
  },
  en:{
    loginTitle1:'Enter your name and', loginTitle2:'last 4 digits of your phone',
    lede:'No app needed — check in right from this screen.',
    nameLabel:'Name', namePh:'e.g. Minji Kim',
    phoneLabel:'Last 4 digits of phone number', phonePh:'1234',
    startBtn:'Start check-in', ownerLink:'Are you the owner? Owner login',
    loginErr:'No matching info found. Please check your name and digits.',
    checkinLabel:"Today's check-in", hello:'Hello,', helloSuffix:'',
    cardTitle:'How are you feeling today?', cardSub:"This is shared gently with your manager. No pressure.",
    notePh:'Leave a short note if you like (optional)', submitBtn:'Submit check-in',
    toastOk:'Check-in complete — thank you 🌿', toastFail:'Save failed, please try again',
    loggedInSuffix:'logged in', logout:'Log out', langLabel:'Language'
  },
  vi:{
    loginTitle1:'Nhập tên và', loginTitle2:'4 số cuối điện thoại',
    lede:'Không cần cài app — check in ngay trên màn hình này.',
    nameLabel:'Tên', namePh:'VD: Kim Min Ji',
    phoneLabel:'4 số cuối điện thoại', phonePh:'1234',
    startBtn:'Bắt đầu check-in', ownerLink:'Bạn là chủ? Đăng nhập chủ',
    loginErr:'Không tìm thấy thông tin phù hợp. Vui lòng kiểm tra tên và số điện thoại.',
    checkinLabel:'Check-in hôm nay', hello:'Xin chào,', helloSuffix:'',
    cardTitle:'Hôm nay bạn cảm thấy thế nào?', cardSub:'Thông tin sẽ được gửi nhẹ nhàng đến quản lý. Đừng lo lắng.',
    notePh:'Để lại một dòng ghi chú nếu muốn (không bắt buộc)', submitBtn:'Gửi check-in',
    toastOk:'Check-in hoàn tất — cảm ơn bạn 🌿', toastFail:'Lưu thất bại, vui lòng thử lại',
    loggedInSuffix:'đã đăng nhập', logout:'Đăng xuất', langLabel:'Ngôn ngữ'
  },
  zh:{
    loginTitle1:'请输入姓名和', loginTitle2:'电话号码后4位',
    lede:'无需安装应用，直接在此画面完成签到。',
    nameLabel:'姓名', namePh:'例：金敏智',
    phoneLabel:'电话号码后4位', phonePh:'1234',
    startBtn:'开始签到', ownerLink:'您是老板吗？老板登录',
    loginErr:'未找到匹配信息，请确认姓名和后4位数字。',
    checkinLabel:'今日签到', hello:'您好，', helloSuffix:'',
    cardTitle:'今天感觉怎么样？', cardSub:'会轻松地传达给老板，不用有压力。',
    notePh:'如果想留言可以写一句（选填）', submitBtn:'提交签到',
    toastOk:'签到完成 — 谢谢 🌿', toastFail:'保存失败，请重试',
    loggedInSuffix:'已登录', logout:'登出', langLabel:'语言'
  }
};
let currentLang = 'ko';
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.ko[key]; }

let session = null; /* {type:'staff', staff:{...}} or {type:'owner'} */
let selectedMood = null;
let loginError = '';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function setTopTag(){
  const tag = document.getElementById('topTag');
  if(!session){ tag.innerHTML=''; return; }
  if(session.type === 'owner'){
    tag.innerHTML = `<div class="top-tag">${session.name} (오너) 로 로그인됨 · <span style="text-decoration:underline;cursor:pointer" onclick="logout()">로그아웃</span></div>`;
  } else {
    tag.innerHTML = `<div class="top-tag">${session.staff.name} ${t('loggedInSuffix')} · <span style="text-decoration:underline;cursor:pointer" onclick="logout()">${t('logout')}</span></div>`;
  }
}

function logout(){
  session = null; selectedMood = null; loginError=''; currentLang = 'ko';
  render();
}

function renderLogin(){
  const langOptions = LANGS.map(l => `<option value="${l.code}" ${l.code===currentLang?'selected':''}>${l.label}</option>`).join('');
  document.getElementById('screen').innerHTML = `
    <div style="display:flex; justify-content:flex-end;">
      <select id="langSelect" onchange="currentLang=this.value; render()" style="width:auto; margin-top:0; padding:8px 10px; font-size:12px;">
        ${langOptions}
      </select>
    </div>
    <div class="greet-label">PARTFLOW ${currentLang==='ko' ? '파일럿' : 'PILOT'}</div>
    <div class="greet-title">${t('loginTitle1')}<br><em>${t('loginTitle2')}</em></div>
    <div class="lede">${t('lede')}</div>

    <div class="card">
      <label>${t('nameLabel')}</label>
      <input type="text" id="loginName" placeholder="${t('namePh')}">
      <label>${t('phoneLabel')}</label>
      <input type="tel" id="loginPhone" placeholder="${t('phonePh')}" maxlength="4">
      <div class="error">${loginError}</div>
      <button class="btn" onclick="tryLogin()">${t('startBtn')}</button>
      <div class="btn-ghost" onclick="showOwnerLogin()">${t('ownerLink')}</div>
    </div>
  `;
}

function renderOwnerLogin(){
  document.getElementById('screen').innerHTML = `
    <div class="greet-label">오너 로그인</div>
    <div class="greet-title">팀 현황을<br><em>확인해볼게요</em></div>
    <div class="card">
      <label>이름</label>
      <input type="text" id="ownerName" placeholder="예: 박대표">
      <label>오너 코드</label>
      <input type="text" id="ownerCode" placeholder="코드 입력">
      <div class="error">${loginError}</div>
      <button class="btn" onclick="tryOwnerLogin()">확인</button>
      <div class="btn-ghost" onclick="loginError=''; render()">← 직원 로그인으로</div>
    </div>
  `;
}

function showOwnerLogin(){ loginError=''; document.getElementById('screen').innerHTML=''; renderOwnerLogin(); }

function tryLogin(){
  const name = document.getElementById('loginName').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  const staff = ROSTER.find(s => s.name === name && s.phone4 === phone);
  if(!staff){
    loginError = t('loginErr');
    renderLogin();
    return;
  }
  session = {type:'staff', staff, lang: currentLang};
  loginError=''; selectedMood=null;
  render();
}

function tryOwnerLogin(){
  const name = document.getElementById('ownerName').value.trim();
  const code = document.getElementById('ownerCode').value.trim();
  if(name !== OWNER.name || code !== OWNER.code){
    loginError = '이름 또는 코드가 일치하지 않아요.';
    renderOwnerLogin();
    return;
  }
  session = {type:'owner', name};
  loginError='';
  render();
}

function selectMood(i){ selectedMood = i; render(); }

const API_BASE = 'https://partflow-kr.netlify.app/.netlify/functions/checkin';

async function submitCheckin(){
  if(selectedMood === null) return;
  const staff = session.staff;
  const noteEl = document.getElementById('noteInput');
  const note = noteEl ? noteEl.value.trim() : '';
  const entry = {
    staffId: staff.id, staffName: staff.name,
    mood: MOODS[selectedMood], moodIndex: selectedMood,
    note, lang: session.lang || 'ko'
  };
  try{
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(entry)
    });
    const data = await res.json();
    if(res.ok && data.ok){
      showToast(t('toastOk'));
      selectedMood = null;
      render();
    } else {
      showToast(t('toastFail'));
    }
  }catch(e){ showToast(t('toastFail') + ': ' + e.message); }
}

function renderStaffScreen(){
  const staff = session.staff;
  const moodButtons = MOODS.map((m,i)=>
    `<div class="mood ${selectedMood===i?'active':''}" onclick="selectMood(${i})">${m}</div>`
  ).join('');
  document.getElementById('screen').innerHTML = `
    <div class="greet-label">${t('checkinLabel')}</div>
    <div class="greet-title">${t('hello')}<br><em>${staff.name}</em>${t('helloSuffix')}</div>
    <div class="card">
      <div class="card-title">${t('cardTitle')}</div>
      <div class="card-sub">${t('cardSub')}</div>
      <div class="mood-row">${moodButtons}</div>
      <textarea id="noteInput" placeholder="${t('notePh')}"></textarea>
      <button class="btn" ${selectedMood===null?'disabled':''} onclick="submitCheckin()">${t('submitBtn')}</button>
    </div>
  `;
}

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff/60000);
  if(min < 1) return '방금 전';
  if(min < 60) return min + '분 전';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr + '시간 전';
  return Math.floor(hr/24) + '일 전';
}

async function loadAllCheckins(){
  try{
    const res = await fetch(API_BASE);
    const data = await res.json();
    if(!data.ok || !data.items) return [];
    const entries = data.items.map(it => ({
      staffId: it.staffId,
      staffName: it.staffName,
      mood: it.mood,
      moodIndex: it.moodIndex,
      note: it.note,
      lang: it.lang,
      time: (it.submittedAt && it.submittedAt.$date) ? it.submittedAt.$date : it.submittedAt
    }));
    entries.sort((a,b)=> new Date(b.time) - new Date(a.time));
    return entries;
  }catch(e){ return []; }
}

let openaiKey = ''; /* 세션 메모리에만 보관, 저장소에 남기지 않음 */
const translationCache = {};

function setOpenaiKey(){
  const val = document.getElementById('openaiKeyInput').value.trim();
  if(val){ openaiKey = val; showToast('API 키가 설정됐어요 (이 세션에서만 유지)'); }
  renderOwnerScreen();
}

async function translateNote(entryKey, noteText, srcLang){
  if(!openaiKey){ showToast('먼저 OpenAI API 키를 입력해주세요'); return; }
  if(translationCache[entryKey]){ renderOwnerScreen(); return; }
  const btn = document.getElementById('tbtn-' + entryKey);
  if(btn){ btn.textContent = '번역 중…'; btn.disabled = true; }
  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + openaiKey },
      body: JSON.stringify({
        model:'gpt-4o-mini',
        messages:[
          {role:'system', content:'You are a translator. Translate the given employee note into natural, concise Korean. Reply with ONLY the translated Korean text, nothing else.'},
          {role:'user', content: noteText}
        ],
        temperature:0.2
      })
    });
    const data = await res.json();
    if(data.error){ showToast('번역 오류: ' + data.error.message); if(btn){btn.textContent='번역'; btn.disabled=false;} return; }
    const translated = data.choices?.[0]?.message?.content?.trim() || '(번역 실패)';
    translationCache[entryKey] = translated;
    try{ await window.storage.set('translation:' + entryKey, translated, true); }catch(e){}
    renderOwnerScreen();
  }catch(e){
    showToast('번역 요청 실패: ' + e.message);
    if(btn){ btn.textContent='번역'; btn.disabled=false; }
  }
}

async function renderOwnerScreen(){
  document.getElementById('screen').innerHTML = `
    <div class="greet-label">오늘 살펴볼 팀</div>
    <div class="greet-title">팀원들의<br><em>오늘</em></div>

    <div class="card" style="padding:14px 16px;">
      <div class="card-sub" style="margin-top:0;">OpenAI API 키 (외국어 메모 번역용, 이 세션에서만 사용)</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="openaiKeyInput" placeholder="sk-..." value="${openaiKey}" style="flex:1;">
        <button class="btn" style="margin-top:0; width:auto; padding:11px 16px;" onclick="setOpenaiKey()">저장</button>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title">실시간 체크인</div>
      <div class="section-count" id="checkinCount">불러오는 중…</div>
    </div>
    <div id="checkinList"><div class="empty">불러오는 중…</div></div>
  `;
  const entries = await loadAllCheckins();
  try{
    const tlist = await window.storage.list('translation:', true);
    if(tlist && tlist.keys){
      for(const k of tlist.keys){
        const entryKey = k.replace('translation:', '');
        if(!translationCache[entryKey]){
          const r = await window.storage.get(k, true);
          if(r && r.value) translationCache[entryKey] = r.value;
        }
      }
    }
  }catch(e){}
  document.getElementById('checkinCount').textContent = entries.length + '건';
  if(entries.length === 0){
    document.getElementById('checkinList').innerHTML = `<div class="empty">아직 체크인이 없어요.<br>직원에게 링크를 공유해보세요.</div>`;
    return;
  }
  document.getElementById('checkinList').innerHTML = entries.slice(0,30).map(e=>{
    const staff = ROSTER.find(s=>s.id===e.staffId) || {color:'linear-gradient(135deg,#c98f8f,#e8c4c4)', initial:'?'};
    const lowMood = e.moodIndex <= 1;
    const entryKey = e.staffId + '-' + e.time;
    const isForeign = e.lang && e.lang !== 'ko' && e.note;
    let translationHtml = '';
    if(isForeign){
      if(translationCache[entryKey]){
        translationHtml = `<div style="font-size:11.5px; color:var(--sage-deep); margin-top:3px;">🌐 ${translationCache[entryKey]}</div>`;
      } else {
        translationHtml = `<div><span id="tbtn-${entryKey}" onclick="translateNote('${entryKey}', ${JSON.stringify(e.note)}, '${e.lang}')" style="font-size:11px; color:var(--rose-deep); text-decoration:underline; cursor:pointer;">번역</span></div>`;
      }
    }
    return `
      <div class="staff-card">
        <div class="avatar" style="background:${staff.color}">${staff.initial}</div>
        <div class="staff-info">
          <div class="staff-name">${e.staffName}</div>
          <div class="staff-note">${e.note ? e.note : (lowMood ? '컨디션이 안 좋아 보여요 — 챙겨주세요' : '오늘도 화이팅')} · ${timeAgo(e.time)}</div>
          ${translationHtml}
        </div>
        <div class="mood-badge">${e.mood}</div>
      </div>
    `;
  }).join('');
}

function render(){
  setTopTag();
  if(!session){ renderLogin(); return; }
  if(session.type === 'staff') renderStaffScreen();
  else renderOwnerScreen();
}

render();
</script>

</body>
</html>
